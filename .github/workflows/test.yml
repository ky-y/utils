name: Test (Biome, Vitest, Build)

on:
    push:
        branches: [ '*' ]
    pull_request:
        branches: [ '*' ]

    workflow_dispatch:

jobs:
    setup:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - uses: pnpm/action-setup@v4

            - name: Cache Dependencies
              id: pnpm_cache
              uses: actions/cache@v4
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Install Dependencies
              if: steps.pnpm_cache.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile


    biome:
        runs-on: ubuntu-latest
        needs:
            - setup
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - uses: pnpm/action-setup@v4

            - name: Restore Cache Dependencies
              uses: actions/cache@v4
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Biome Check
              run: pnpm lint


    vitest:
        runs-on: ubuntu-latest
        needs:
            - setup
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - uses: pnpm/action-setup@v4

            - name: Restore Cache Dependencies
              uses: actions/cache@v4
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Vitest Check
              run: pnpm test


    build:
        runs-on: ubuntu-latest
        needs:
            - setup
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - uses: pnpm/action-setup@v4

            - name: Restore Cache Dependencies
              uses: actions/cache@v4
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Build Check
              run: pnpm build
